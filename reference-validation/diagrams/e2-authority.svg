<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="3912" viewBox="0 0 1880 3912" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">E2 authority synthetic directed graph</title>
<desc id="diagram-description">Offline edge view. Repeated boxes refer to the same logical node IDs. Synthetic architecture only, not service or recovery validation. Red dashed edges are rejected designs.</desc>
<rect width="1880" height="3912" fill="#ffffff"/><defs><marker id="arrow-0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0078D4"/></marker><marker id="arrow-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C2D91"/></marker><marker id="arrow-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D13438"/></marker></defs>
<rect x="20" y="220" width="1840" height="3672" rx="6" fill="none" stroke="#495057" stroke-width="2"/>
<text id="e2-authority-title" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="24"><tspan x="52" y="50">E2 directed authority — synthetic edge view</tspan></text>
<text id="e2-authority-insight" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="47" y="117.5">Arrow: from exercises the listed permission over to. Credential, delegation and revocation belong to that edge. Repeated node boxes are</tspan><tspan x="47" y="152.5">occurrences of the same logical record node. No deployed authority was inspected.</tspan></text>
<text id="e2-authority-E2-AE01-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="280">E2-AE01</tspan></text>
<text id="e2-authority-E2-AE01-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="330">Authenticate the verified home identity; no target administrator entitlement.</tspan></text>
<rect x="60" y="361" width="400" height="94" rx="6" fill="none" stroke="#0078D4" stroke-width="2"/>
<text id="e2-authority-E2-AE01-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="390.5">E2-A-HOME</tspan><tspan x="79" y="425.5">Orbit home identity authority</tspan></text>
<rect x="1420" y="361" width="400" height="94" rx="6" fill="none" stroke="#0078D4" stroke-width="2"/>
<text id="e2-authority-E2-AE01-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="390.5">E2-A-GUEST</tspan><tspan x="1439" y="425.5">Ten sponsored guest identities</tspan></text>
<path d="M 470 408 L 1410 408" fill="none" stroke="#0078D4" stroke-width="2" marker-end="url(#arrow-0)"/>
<text id="e2-authority-E2-AE01-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="490">Credential: Home-tenant user method and signed issuer assertion.</tspan><tspan x="66" y="520">Delegation: Transition accepts only the named home issuer/user cohort; device/MFA claims not automatically trusted.</tspan><tspan x="66" y="550">Revoke — Orbit identity owner and transition app owner: Disable source user, then remove target assignment and deny resource sessions independently.</tspan><tspan x="66" y="580">Timing/residual: 30-minute effective-denial objective, unmeasured. Home disablement alone may leave target sessions/tokens valid.</tspan></text>
<text id="e2-authority-E2-AE02-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="679">E2-AE02</tspan></text>
<text id="e2-authority-E2-AE02-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="729">Approve/renew only deal-room reader assignment for at most 30 days.</tspan></text>
<rect x="60" y="760" width="400" height="94" rx="6" fill="none" stroke="#0078D4" stroke-width="2"/>
<text id="e2-authority-E2-AE02-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="789.5">E2-A-SPONSOR</tspan><tspan x="79" y="824.5">Cedar deal-room sponsor</tspan></text>
<rect x="1420" y="760" width="400" height="94" rx="6" fill="none" stroke="#0078D4" stroke-width="2"/>
<text id="e2-authority-E2-AE02-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="789.5">E2-A-GUEST</tspan><tspan x="1439" y="824.5">Ten sponsored guest identities</tspan></text>
<path d="M 470 807 L 1410 807" fill="none" stroke="#0078D4" stroke-width="2" marker-end="url(#arrow-0)"/>
<text id="e2-authority-E2-AE02-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="889">Credential: Protected sponsor identity with scoped lifecycle approval.</tspan><tspan x="66" y="919">Delegation: Transaction data owner defines ten-person cohort and purpose.</tspan><tspan x="66" y="949">Revoke — Deal-room access owner: Expire/remove assignment, disable orphaned guest and request app-side session denial.</tspan><tspan x="66" y="979">Timing/residual: 30-minute proposed objective after removal/expiry. Exported documents and independent workload access require separate handling.</tspan></text>
<text id="e2-authority-E2-AE03-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="1078">E2-AE03</tspan></text>
<text id="e2-authority-E2-AE03-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="1128">Configure only approved inbound issuer/app/user allow-lists; no Cedar production</tspan><tspan x="496" y="1158">role.</tspan></text>
<rect x="60" y="1189" width="400" height="129" rx="6" fill="none" stroke="#0078D4" stroke-width="2"/>
<text id="e2-authority-E2-AE03-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="1218.5">E2-A-ADMIN</tspan><tspan x="79" y="1253.5">Separate transition</tspan><tspan x="79" y="1288.5">administrator</tspan></text>
<rect x="1420" y="1189" width="400" height="94" rx="6" fill="none" stroke="#0078D4" stroke-width="2"/>
<text id="e2-authority-E2-AE03-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="1218.5">E2-A-TRUST</tspan><tspan x="1439" y="1253.5">Allow-listed transition trust</tspan></text>
<path d="M 470 1253.5 L 1410 1253.5" fill="none" stroke="#0078D4" stroke-width="2" marker-end="url(#arrow-0)"/>
<text id="e2-authority-E2-AE03-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="1353">Credential: Separate cloud admin identity with supported phishing-resistant method.</tspan><tspan x="66" y="1383">Delegation: Transition tenant owner approves reversible scoped trust changes.</tspan><tspan x="66" y="1413">Revoke — Transition tenant incident owner: Remove role/trust administration, revoke applicable sessions and compare baseline.</tspan><tspan x="66" y="1443">Timing/residual: 15-minute containment objective; actual behavior untested. Previously created grants/guest assignments need graph reconciliation.</tspan></text>
<text id="e2-authority-E2-AE04-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="1542">E2-AE04</tspan></text>
<text id="e2-authority-E2-AE04-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="1592">Admit only named-issuer, named-user identity assertions for the deal-room</tspan><tspan x="496" y="1622">audience.</tspan></text>
<rect x="60" y="1653" width="400" height="94" rx="6" fill="none" stroke="#0078D4" stroke-width="2"/>
<text id="e2-authority-E2-AE04-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="1682.5">E2-A-TRUST</tspan><tspan x="79" y="1717.5">Allow-listed transition trust</tspan></text>
<rect x="1420" y="1653" width="400" height="94" rx="6" fill="none" stroke="#0078D4" stroke-width="2"/>
<text id="e2-authority-E2-AE04-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="1682.5">E2-A-APP</tspan><tspan x="1439" y="1717.5">Deal-room app/session policy</tspan></text>
<path d="M 470 1700 L 1410 1700" fill="none" stroke="#0078D4" stroke-width="2" marker-end="url(#arrow-0)"/>
<text id="e2-authority-E2-AE04-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="1782">Credential: Configured exact issuer/audience trust, not a shared client secret.</tspan><tspan x="66" y="1812">Delegation: Target application/tenant owner allow-lists the cohort.</tspan><tspan x="66" y="1842">Revoke — Transition identity and app owners: Remove inbound trust/assignment and enforce app denial for existing sessions.</tspan><tspan x="66" y="1872">Timing/residual: 30-minute effective-denial objective; not measured. Valid target tokens/application cookies may outlive trust removal.</tspan></text>
<text id="e2-authority-E2-AE05-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="1971">E2-AE05</tspan></text>
<text id="e2-authority-E2-AE05-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="2021">Read only approved deal-room documents while sponsored and unexpired.</tspan></text>
<rect x="60" y="2052" width="400" height="94" rx="6" fill="none" stroke="#0078D4" stroke-width="2"/>
<text id="e2-authority-E2-AE05-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="2081.5">E2-A-GUEST</tspan><tspan x="79" y="2116.5">Ten sponsored guest identities</tspan></text>
<rect x="1420" y="2052" width="400" height="94" rx="6" fill="none" stroke="#0078D4" stroke-width="2"/>
<text id="e2-authority-E2-AE05-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="2081.5">E2-A-APP</tspan><tspan x="1439" y="2116.5">Deal-room app/session policy</tspan></text>
<path d="M 470 2099 L 1410 2099" fill="none" stroke="#0078D4" stroke-width="2" marker-end="url(#arrow-0)"/>
<text id="e2-authority-E2-AE05-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="2181">Credential: Audience-bound target token plus app session subject to resource-side denial.</tspan><tspan x="66" y="2211">Delegation: Sponsor membership plus local app reader policy; no admin action mapping.</tspan><tspan x="66" y="2241">Revoke — Application owner: Remove reader mapping, deny subject/session and test fresh plus previously issued sessions.</tspan><tspan x="66" y="2271">Timing/residual: 30-minute proposed objective; no real timer evidence. Previously downloaded content is not recalled by session revocation.</tspan></text>
<text id="e2-authority-E2-AE06-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="2370">E2-AE06</tspan></text>
<text id="e2-authority-E2-AE06-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="2420">Serve only sanitized documents under label/rights/export policy.</tspan></text>
<rect x="60" y="2451" width="400" height="94" rx="6" fill="none" stroke="#0078D4" stroke-width="2"/>
<text id="e2-authority-E2-AE06-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="2480.5">E2-A-APP</tspan><tspan x="79" y="2515.5">Deal-room app/session policy</tspan></text>
<rect x="1420" y="2451" width="400" height="94" rx="6" fill="none" stroke="#0078D4" stroke-width="2"/>
<text id="e2-authority-E2-AE06-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="2480.5">E2-A-DATA</tspan><tspan x="1439" y="2515.5">Sanitized deal documents</tspan></text>
<path d="M 470 2498 L 1410 2498" fill="none" stroke="#0078D4" stroke-width="2" marker-end="url(#arrow-0)"/>
<text id="e2-authority-E2-AE06-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="2580">Credential: App-managed resource identity scoped to sanitized store.</tspan><tspan x="66" y="2610">Delegation: Transaction data owner grants store access.</tspan><tspan x="66" y="2640">Revoke — Transaction data owner: Remove resource role, block app/store sessions and rotate if compromise warrants under separate approval.</tspan><tspan x="66" y="2670">Timing/residual: 15-minute proposed objective. Data already copied outside the store needs independent response.</tspan></text>
<text id="e2-authority-E2-AE07-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="2769">E2-AE07</tspan></text>
<text id="e2-authority-E2-AE07-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="2819">Deploy reviewed deal-room code only; no role/consent/trust assignment</tspan><tspan x="496" y="2849">capability.</tspan></text>
<rect x="60" y="2880" width="400" height="94" rx="6" fill="none" stroke="#0078D4" stroke-width="2"/>
<text id="e2-authority-E2-AE07-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="2909.5">E2-A-CI</tspan><tspan x="79" y="2944.5">Transition deployment workload</tspan></text>
<rect x="1420" y="2880" width="400" height="94" rx="6" fill="none" stroke="#0078D4" stroke-width="2"/>
<text id="e2-authority-E2-AE07-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="2909.5">E2-A-APP</tspan><tspan x="1439" y="2944.5">Deal-room app/session policy</tspan></text>
<path d="M 470 2927 L 1410 2927" fill="none" stroke="#0078D4" stroke-width="2" marker-end="url(#arrow-0)"/>
<text id="e2-authority-E2-AE07-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="3009">Credential: Transition-specific workload federation binding with exact issuer/subject/audience.</tspan><tspan x="66" y="3039">Delegation: Transition release owner grants scoped deployment permission.</tspan><tspan x="66" y="3069">Revoke — Transition release owner: Remove federation binding and resource permission, cancel deployments and inspect previously deployed code.</tspan><tspan x="66" y="3099">Timing/residual: 15-minute proposed objective. Disabling credential does not undo previously deployed privileged code.</tspan></text>
<text id="e2-authority-E2-AE08-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="3198">E2-AE08</tspan></text>
<text id="e2-authority-E2-AE08-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="3248">Emergency removal/recovery of approved transition trust during home-IdP</tspan><tspan x="496" y="3278">unavailability.</tspan></text>
<rect x="60" y="3309" width="400" height="129" rx="6" fill="none" stroke="#0078D4" stroke-width="2"/>
<text id="e2-authority-E2-AE08-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="3338.5">E2-A-EMERG</tspan><tspan x="79" y="3373.5">Target cloud-only emergency</tspan><tspan x="79" y="3408.5">custodians</tspan></text>
<rect x="1420" y="3309" width="400" height="94" rx="6" fill="none" stroke="#0078D4" stroke-width="2"/>
<text id="e2-authority-E2-AE08-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="3338.5">E2-A-TRUST</tspan><tspan x="1439" y="3373.5">Allow-listed transition trust</tspan></text>
<path d="M 470 3373.5 L 1410 3373.5" fill="none" stroke="#0078D4" stroke-width="2" marker-end="url(#arrow-0)"/>
<text id="e2-authority-E2-AE08-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="3473">Credential: Two separately controlled .onmicrosoft.com cloud-only target identities with permanent-active Global Administrator assignments and supported</tspan><tspan x="66" y="3503">phishing-resistant methods; no Orbit guest authentication.</tspan><tspan x="66" y="3533">Delegation: Target tenant owner pre-approves emergency custody/monitoring.</tspan><tspan x="66" y="3563">Revoke — Independent transition incident owner: Contain compromised method/account only after preserving another verified emergency path.</tspan><tspan x="66" y="3593">Timing/residual: Incident-specific; untested. Target Entra and management APIs still required.</tspan></text>
<text id="e2-authority-limits" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="3687">Forbidden authority paths:</tspan><tspan x="66" y="3717">Orbit home/guest → Cedar production administration</tspan><tspan x="66" y="3747">Orbit guest → transition tenant role, consent or trust administration</tspan><tspan x="66" y="3777">Sponsor → unrestricted user provisioning or tenant role grants</tspan><tspan x="66" y="3807">Transition workload → recreate removed trust/guest assignments</tspan><tspan x="66" y="3837">Emergency separation → source-home-IdP approval dependency</tspan></text>
</svg>
