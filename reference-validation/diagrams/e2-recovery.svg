<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="3517" viewBox="0 0 1880 3517" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">E2 recovery synthetic directed graph</title>
<desc id="diagram-description">Offline edge view. Repeated boxes refer to the same logical node IDs. Synthetic architecture only, not service or recovery validation. Red dashed edges are rejected designs.</desc>
<rect width="1880" height="3517" fill="#ffffff"/><defs><marker id="arrow-0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0078D4"/></marker><marker id="arrow-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C2D91"/></marker><marker id="arrow-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D13438"/></marker></defs>
<rect x="20" y="220" width="1840" height="3277" rx="6" fill="none" stroke="#495057" stroke-width="2"/>
<text id="e2-recovery-title" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="24"><tspan x="52" y="50">E2 recovery dependencies — synthetic edge view</tspan></text>
<text id="e2-recovery-insight" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="47" y="117.5">Arrow: recovering component depends on target. RED dashed edges are rejected alternatives, retained to expose bootstrap cycles; they are</tspan><tspan x="47" y="152.5">excluded from the selected dependency graph. Design mitigation is NOT tested recovery.</tspan></text>
<text id="e2-recovery-E2-RE01-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="280">E2-RE01</tspan></text>
<text id="e2-recovery-E2-RE01-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="330">Independent target authority removes/reconstructs scoped trust.</tspan></text>
<rect x="60" y="361" width="400" height="94" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e2-recovery-E2-RE01-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="390.5">E2-R-EXIT</tspan><tspan x="79" y="425.5">Verified transition separation</tspan></text>
<rect x="1420" y="361" width="400" height="129" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e2-recovery-E2-RE01-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="390.5">E2-R-ADMIN</tspan><tspan x="1439" y="425.5">Independent target emergency</tspan><tspan x="1439" y="460.5">admin</tspan></text>
<path d="M 470 425.5 L 1410 425.5" fill="none" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrow-1)"/>
<text id="e2-recovery-E2-RE01-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="525">Failure: Source compromise can obstruct separation if target control is unavailable.</tspan><tspan x="66" y="555">Alternative: Second separately controlled target emergency account.</tspan></text>
<text id="e2-recovery-E2-RE02-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="654">E2-RE02</tspan></text>
<text id="e2-recovery-E2-RE02-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="704">Offline method retrieval independent of Orbit.</tspan></text>
<rect x="60" y="735" width="400" height="129" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e2-recovery-E2-RE02-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="764.5">E2-R-ADMIN</tspan><tspan x="79" y="799.5">Independent target emergency</tspan><tspan x="79" y="834.5">admin</tspan></text>
<rect x="1420" y="735" width="400" height="94" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e2-recovery-E2-RE02-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="764.5">E2-R-CUSTODY</tspan><tspan x="1439" y="799.5">Target offline method custody</tspan></text>
<path d="M 470 799.5 L 1410 799.5" fill="none" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrow-1)"/>
<text id="e2-recovery-E2-RE02-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="899">Failure: Target admin is unusable despite existing account.</tspan><tspan x="66" y="929">Alternative: Separate verified custody route.</tspan></text>
<text id="e2-recovery-E2-RE03-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="1028">E2-RE03</tspan></text>
<text id="e2-recovery-E2-RE03-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="1078">Entra/target APIs and protected client path work.</tspan></text>
<rect x="60" y="1109" width="400" height="129" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e2-recovery-E2-RE03-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="1138.5">E2-R-ADMIN</tspan><tspan x="79" y="1173.5">Independent target emergency</tspan><tspan x="79" y="1208.5">admin</tspan></text>
<rect x="1420" y="1109" width="400" height="94" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e2-recovery-E2-RE03-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="1138.5">E2-R-CLOUD</tspan><tspan x="1439" y="1173.5">Target Entra and app APIs</tspan></text>
<path d="M 470 1173.5 L 1410 1173.5" fill="none" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrow-1)"/>
<text id="e2-recovery-E2-RE03-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="1273">Failure: No cloud trust changes; this is not full cloud-outage recovery.</tspan><tspan x="66" y="1303">Alternative: Pre-approved app-side deny where independently reachable; mark cloud cleanup pending.</tspan></text>
<text id="e2-recovery-E2-RE04-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="1402">E2-RE04</tspan></text>
<text id="e2-recovery-E2-RE04-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="1452">Trusted complete guest/grant/workload graph and target inventory.</tspan></text>
<rect x="60" y="1483" width="400" height="94" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e2-recovery-E2-RE04-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="1512.5">E2-R-EXIT</tspan><tspan x="79" y="1547.5">Verified transition separation</tspan></text>
<rect x="1420" y="1483" width="400" height="129" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e2-recovery-E2-RE04-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="1512.5">E2-R-BASE</tspan><tspan x="1439" y="1547.5">External approved object/edge</tspan><tspan x="1439" y="1582.5">baseline</tspan></text>
<path d="M 470 1547.5 L 1410 1547.5" fill="none" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrow-1)"/>
<text id="e2-recovery-E2-RE04-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="1647">Failure: Residual access may be missed.</tspan><tspan x="66" y="1677">Alternative: Quarantine all transition app access until inventory reconciled.</tspan></text>
<text id="e2-recovery-E2-RE05-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="1776">E2-RE05</tspan></text>
<text id="e2-recovery-E2-RE05-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="1826">Resource-side sessions, permissions and workload bindings actually deny.</tspan></text>
<rect x="60" y="1857" width="400" height="94" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e2-recovery-E2-RE05-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="1886.5">E2-R-EXIT</tspan><tspan x="79" y="1921.5">Verified transition separation</tspan></text>
<rect x="1420" y="1857" width="400" height="129" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e2-recovery-E2-RE05-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="1886.5">E2-R-SESSION</tspan><tspan x="1439" y="1921.5">App session and workload deny</tspan><tspan x="1439" y="1956.5">controls</tspan></text>
<path d="M 470 1921.5 L 1410 1921.5" fill="none" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrow-1)"/>
<text id="e2-recovery-E2-RE05-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="2021">Failure: Trust removal looks complete while old sessions or app credentials still work.</tspan><tspan x="66" y="2051">Alternative: Keep application access blocked and retain logs.</tspan></text>
<text id="e2-recovery-E2-RE06-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="2150">E2-RE06</tspan></text>
<text id="e2-recovery-E2-RE06-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="2200">Remove/reconcile named inbound trust, assignments and guest lifecycle links.</tspan></text>
<rect x="60" y="2231" width="400" height="94" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e2-recovery-E2-RE06-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="2260.5">E2-R-EXIT</tspan><tspan x="79" y="2295.5">Verified transition separation</tspan></text>
<rect x="1420" y="2231" width="400" height="94" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e2-recovery-E2-RE06-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="2260.5">E2-R-TRUST</tspan><tspan x="1439" y="2295.5">Cross-tenant trust configuration</tspan></text>
<path d="M 470 2278 L 1410 2278" fill="none" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrow-1)"/>
<text id="e2-recovery-E2-RE06-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="2360">Failure: New access can be issued again.</tspan><tspan x="66" y="2390">Alternative: Explicit deny at app and issuer scope pending target cleanup.</tspan></text>
<text id="e2-recovery-E2-RE07-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="2489">E2-RE07 — REJECTED DESIGN</tspan></text>
<text id="e2-recovery-E2-RE07-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="2539">Rejected design: source guest sign-in needs working cross-tenant trust.</tspan></text>
<rect x="60" y="2570" width="400" height="129" rx="6" fill="none" stroke="#D13438" stroke-width="2"/>
<text id="e2-recovery-E2-RE07-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="2599.5">E2-R-HOME</tspan><tspan x="79" y="2634.5">Rejected source guest sign-in</tspan><tspan x="79" y="2669.5">bootstrap</tspan></text>
<rect x="1420" y="2570" width="400" height="94" rx="6" fill="none" stroke="#D13438" stroke-width="2"/>
<text id="e2-recovery-E2-RE07-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="2599.5">E2-R-TRUST</tspan><tspan x="1439" y="2634.5">Cross-tenant trust configuration</tspan></text>
<path d="M 470 2634.5 L 1410 2634.5" fill="none" stroke="#D13438" stroke-width="2" stroke-dasharray="10 8" marker-end="url(#arrow-2)"/>
<text id="e2-recovery-E2-RE07-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="2734">Failure: Removing trust prevents cleanup authentication.</tspan><tspan x="66" y="2764">Alternative: Target cloud-only admin is not a guest.</tspan></text>
<text id="e2-recovery-E2-RE08-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="2863">E2-RE08 — REJECTED DESIGN</tspan></text>
<text id="e2-recovery-E2-RE08-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="2913">Rejected design: only source guest admin can repair/remove trust.</tspan></text>
<rect x="60" y="2944" width="400" height="94" rx="6" fill="none" stroke="#D13438" stroke-width="2"/>
<text id="e2-recovery-E2-RE08-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="2973.5">E2-R-TRUST</tspan><tspan x="79" y="3008.5">Cross-tenant trust configuration</tspan></text>
<rect x="1420" y="2944" width="400" height="129" rx="6" fill="none" stroke="#D13438" stroke-width="2"/>
<text id="e2-recovery-E2-RE08-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="2973.5">E2-R-HOME</tspan><tspan x="1439" y="3008.5">Rejected source guest sign-in</tspan><tspan x="1439" y="3043.5">bootstrap</tspan></text>
<path d="M 470 3008.5 L 1410 3008.5" fill="none" stroke="#D13438" stroke-width="2" stroke-dasharray="10 8" marker-end="url(#arrow-2)"/>
<text id="e2-recovery-E2-RE08-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="3108">Failure: Source failure/compromise makes recovery circular.</tspan><tspan x="66" y="3138">Alternative: Independent target admin/custody breaks this proposed edge.</tspan></text>
<text id="e2-recovery-limits" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="3232">Known cycles:</tspan><tspan x="66" y="3262">E2-RC01: E2-R-HOME -&gt; E2-R-TRUST; broken-by-design-not-tested. RE07/RE08 expose the rejected guest-admin bootstrap. Recovery must use target cloud-only authority and</tspan><tspan x="66" y="3292">offline custody, then prove separation with fresh and existing-session tests.</tspan><tspan x="66" y="3322">Independent anchors:</tspan><tspan x="66" y="3352">E2-R-CUSTODY: independent of Orbit home IdP and administrators, Cross-tenant guest sign-in, Normal ticketing/password vault; still depends on Target Entra cloud</tspan><tspan x="66" y="3382">authentication, Custodian and supported method/device. Proof: Authorized R1 test in target tenant with source path not required; not executed.</tspan><tspan x="66" y="3412">E2-R-BASE: independent of Transition tenant write access, Acquired admin credentials; still depends on Independent integrity/custody and current app grant inventory,</tspan><tspan x="66" y="3442">Target/cloud APIs for cleanup. Proof: Retrieve trusted graph and reconcile all relationships during approved separation; not executed.</tspan></text>
</svg>
