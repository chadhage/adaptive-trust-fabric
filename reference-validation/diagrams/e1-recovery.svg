<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="4046" viewBox="0 0 1880 4046" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">E1 recovery synthetic directed graph</title>
<desc id="diagram-description">Offline edge view. Repeated boxes refer to the same logical node IDs. Synthetic architecture only, not service or recovery validation. Red dashed edges are rejected designs.</desc>
<rect width="1880" height="4046" fill="#ffffff"/><defs><marker id="arrow-0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0078D4"/></marker><marker id="arrow-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C2D91"/></marker><marker id="arrow-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D13438"/></marker></defs>
<rect x="20" y="220" width="1840" height="3806" rx="6" fill="none" stroke="#495057" stroke-width="2"/>
<text id="e1-recovery-title" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="24"><tspan x="52" y="50">E1 recovery dependencies — synthetic edge view</tspan></text>
<text id="e1-recovery-insight" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="47" y="117.5">Arrow: recovering component depends on target. RED dashed edges are rejected alternatives, retained to expose bootstrap cycles; they are</tspan><tspan x="47" y="152.5">excluded from the selected dependency graph. Design mitigation is NOT tested recovery.</tspan></text>
<text id="e1-recovery-E1-RE01-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="280">E1-RE01</tspan></text>
<text id="e1-recovery-E1-RE01-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="330">Approved recovery authority can perform scoped changes.</tspan></text>
<rect x="60" y="361" width="400" height="129" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e1-recovery-E1-RE01-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="390.5">E1-R-CONFIG</tspan><tspan x="79" y="425.5">Scoped tenant configuration</tspan><tspan x="79" y="460.5">restore</tspan></text>
<rect x="1420" y="361" width="400" height="129" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e1-recovery-E1-RE01-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="390.5">E1-R-EMERG</tspan><tspan x="1439" y="425.5">Cloud-only recovery</tspan><tspan x="1439" y="460.5">administration</tspan></text>
<path d="M 470 425.5 L 1410 425.5" fill="none" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrow-1)"/>
<text id="e1-recovery-E1-RE01-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="525">Failure: Baseline cannot be applied.</tspan><tspan x="66" y="555">Alternative: Second separately controlled emergency account, still cloud dependent.</tspan></text>
<text id="e1-recovery-E1-RE02-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="654">E1-RE02</tspan></text>
<text id="e1-recovery-E1-RE02-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="704">Cloud auth, DNS/time/network and management APIs are reachable.</tspan></text>
<rect x="60" y="735" width="400" height="129" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e1-recovery-E1-RE02-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="764.5">E1-R-EMERG</tspan><tspan x="79" y="799.5">Cloud-only recovery</tspan><tspan x="79" y="834.5">administration</tspan></text>
<rect x="1420" y="735" width="400" height="94" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e1-recovery-E1-RE02-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="764.5">E1-R-CLOUD</tspan><tspan x="1439" y="799.5">Reachable Entra and target APIs</tspan></text>
<path d="M 470 799.5 L 1410 799.5" fill="none" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrow-1)"/>
<text id="e1-recovery-E1-RE02-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="899">Failure: No cloud administration; full cloud outage outside R1/R3.</tspan><tspan x="66" y="929">Alternative: Wait/escalate service incident; no fictional offline Entra login.</tspan></text>
<text id="e1-recovery-E1-RE03-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="1028">E1-RE03</tspan></text>
<text id="e1-recovery-E1-RE03-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="1078">Independent supported emergency method retrieval.</tspan></text>
<rect x="60" y="1109" width="400" height="129" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e1-recovery-E1-RE03-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="1138.5">E1-R-EMERG</tspan><tspan x="79" y="1173.5">Cloud-only recovery</tspan><tspan x="79" y="1208.5">administration</tspan></text>
<rect x="1420" y="1109" width="400" height="94" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e1-recovery-E1-RE03-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="1138.5">E1-R-CUSTODY</tspan><tspan x="1439" y="1173.5">Offline method custody</tspan></text>
<path d="M 470 1173.5 L 1410 1173.5" fill="none" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrow-1)"/>
<text id="e1-recovery-E1-RE03-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="1273">Failure: Emergency account exists but is unusable.</tspan><tspan x="66" y="1303">Alternative: Second independent custody path.</tspan></text>
<text id="e1-recovery-E1-RE04-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="1402">E1-RE04</tspan></text>
<text id="e1-recovery-E1-RE04-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="1452">Trusted pre-change version and known coverage/retention.</tspan></text>
<rect x="60" y="1483" width="400" height="129" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e1-recovery-E1-RE04-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="1512.5">E1-R-CONFIG</tspan><tspan x="79" y="1547.5">Scoped tenant configuration</tspan><tspan x="79" y="1582.5">restore</tspan></text>
<rect x="1420" y="1483" width="400" height="94" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e1-recovery-E1-RE04-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="1512.5">E1-R-BASE</tspan><tspan x="1439" y="1547.5">External approved baseline</tspan></text>
<path d="M 470 1547.5 L 1410 1547.5" fill="none" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrow-1)"/>
<text id="e1-recovery-E1-RE04-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="1647">Failure: Unknown state may reintroduce malicious change.</tspan><tspan x="66" y="1677">Alternative: Earlier independently approved version; otherwise stop.</tspan></text>
<text id="e1-recovery-E1-RE05-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="1776">E1-RE05</tspan></text>
<text id="e1-recovery-E1-RE05-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="1826">Recreated IDs/roles/consent/CA references are reconciled.</tspan></text>
<rect x="60" y="1857" width="400" height="129" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e1-recovery-E1-RE05-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="1886.5">E1-R-CONFIG</tspan><tspan x="79" y="1921.5">Scoped tenant configuration</tspan><tspan x="79" y="1956.5">restore</tspan></text>
<rect x="1420" y="1857" width="400" height="129" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e1-recovery-E1-RE05-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="1886.5">E1-R-EDGES</tspan><tspan x="1439" y="1921.5">Object-ID and relationship</tspan><tspan x="1439" y="1956.5">reconstruction</tspan></text>
<path d="M 470 1921.5 L 1410 1921.5" fill="none" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrow-1)"/>
<text id="e1-recovery-E1-RE05-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="2021">Failure: Objects present but intended access fails or unintended privilege persists.</tspan><tspan x="66" y="2051">Alternative: Keep dependent app contained until R3 tests pass.</tspan></text>
<text id="e1-recovery-E1-RE06-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="2150">E1-RE06</tspan></text>
<text id="e1-recovery-E1-RE06-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="2200">Baseline directed relationships and approved grants.</tspan></text>
<rect x="60" y="2231" width="400" height="129" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e1-recovery-E1-RE06-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="2260.5">E1-R-EDGES</tspan><tspan x="79" y="2295.5">Object-ID and relationship</tspan><tspan x="79" y="2330.5">reconstruction</tspan></text>
<rect x="1420" y="2231" width="400" height="94" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e1-recovery-E1-RE06-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="2260.5">E1-R-BASE</tspan><tspan x="1439" y="2295.5">External approved baseline</tspan></text>
<path d="M 470 2295.5 L 1410 2295.5" fill="none" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrow-1)"/>
<text id="e1-recovery-E1-RE06-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="2395">Failure: Cannot prove semantic recovery.</tspan><tspan x="66" y="2425">Alternative: Manually reauthorize only explicit owner-approved edges; mark gap.</tspan></text>
<text id="e1-recovery-E1-RE07-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="2524">E1-RE07</tspan></text>
<text id="e1-recovery-E1-RE07-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="2574">Independent audit trail and acceptance evidence.</tspan></text>
<rect x="60" y="2605" width="400" height="129" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e1-recovery-E1-RE07-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="2634.5">E1-R-CONFIG</tspan><tspan x="79" y="2669.5">Scoped tenant configuration</tspan><tspan x="79" y="2704.5">restore</tspan></text>
<rect x="1420" y="2605" width="400" height="94" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e1-recovery-E1-RE07-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="2634.5">E1-R-LOGS</tspan><tspan x="1439" y="2669.5">Independent retained evidence</tspan></text>
<path d="M 470 2669.5 L 1410 2669.5" fill="none" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrow-1)"/>
<text id="e1-recovery-E1-RE07-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="2769">Failure: No defensible recovery/custody acceptance.</tspan><tspan x="66" y="2799">Alternative: Witnessed offline log until approved evidence retrieval resumes.</tspan></text>
<text id="e1-recovery-E1-RE08-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="2898">E1-RE08 — REJECTED DESIGN</tspan></text>
<text id="e1-recovery-E1-RE08-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="2948">Rejected normal vault requires tenant recovery sign-in when ordinary auth is</tspan><tspan x="496" y="2978">blocked.</tspan></text>
<rect x="60" y="3009" width="400" height="94" rx="6" fill="none" stroke="#D13438" stroke-width="2"/>
<text id="e1-recovery-E1-RE08-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="3038.5">E1-R-VAULT</tspan><tspan x="79" y="3073.5">Normal cloud password vault</tspan></text>
<rect x="1420" y="3009" width="400" height="129" rx="6" fill="none" stroke="#D13438" stroke-width="2"/>
<text id="e1-recovery-E1-RE08-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="3038.5">E1-R-EMERG</tspan><tspan x="1439" y="3073.5">Cloud-only recovery</tspan><tspan x="1439" y="3108.5">administration</tspan></text>
<path d="M 470 3073.5 L 1410 3073.5" fill="none" stroke="#D13438" stroke-width="2" stroke-dasharray="10 8" marker-end="url(#arrow-2)"/>
<text id="e1-recovery-E1-RE08-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="3173">Failure: If method is stored only here, bootstrap is circular.</tspan><tspan x="66" y="3203">Alternative: Do not use the normal vault as sole emergency custody.</tspan></text>
<text id="e1-recovery-E1-RE09-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="3302">E1-RE09 — REJECTED DESIGN</tspan></text>
<text id="e1-recovery-E1-RE09-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="3352">Rejected design would retrieve the emergency method only from the same cloud</tspan><tspan x="496" y="3382">vault.</tspan></text>
<rect x="60" y="3413" width="400" height="129" rx="6" fill="none" stroke="#D13438" stroke-width="2"/>
<text id="e1-recovery-E1-RE09-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="3442.5">E1-R-EMERG</tspan><tspan x="79" y="3477.5">Cloud-only recovery</tspan><tspan x="79" y="3512.5">administration</tspan></text>
<rect x="1420" y="3413" width="400" height="94" rx="6" fill="none" stroke="#D13438" stroke-width="2"/>
<text id="e1-recovery-E1-RE09-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="3442.5">E1-R-VAULT</tspan><tspan x="1439" y="3477.5">Normal cloud password vault</tspan></text>
<path d="M 470 3477.5 L 1410 3477.5" fill="none" stroke="#D13438" stroke-width="2" stroke-dasharray="10 8" marker-end="url(#arrow-2)"/>
<text id="e1-recovery-E1-RE09-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="3577">Failure: Normal authentication failure can block emergency authentication.</tspan><tspan x="66" y="3607">Alternative: E1-R-CUSTODY removes this proposed dependency; demonstrate before reliance.</tspan></text>
<text id="e1-recovery-limits" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="3701">Known cycles:</tspan><tspan x="66" y="3731">E1-RC01: E1-R-EMERG -&gt; E1-R-VAULT; broken-by-design-not-tested. RE08/RE09 explicitly show the rejected bootstrap cycle. Select offline independent custody instead; no</tspan><tspan x="66" y="3761">live proof of cycle removal exists.</tspan><tspan x="66" y="3791">Independent anchors:</tspan><tspan x="66" y="3821">E1-R-CUSTODY: independent of Hybrid AD/federation/PTA, Normal cloud vault, PIM and ITSM; still depends on Physical custodian availability, Working supported</tspan><tspan x="66" y="3851">method/device, Entra and target service. Proof: Authorized R1 retrieval and two fresh sign-ins; not performed.</tspan><tspan x="66" y="3881">E1-R-BASE: independent of Exercised tenant administrator write access, Current live tenant configuration; still depends on Independent custodian and integrity anchor,</tspan><tspan x="66" y="3911">Usable current restore/recreation method. Proof: Retrieve independently held approved baseline and execute R3 object+edge recovery; not performed.</tspan><tspan x="66" y="3941">E1-R-LOGS: independent of Emergency account session, Attacker-writable live configuration; still depends on Regional retained evidence access, Clock/provenance checks.</tspan><tspan x="66" y="3971">Proof: Observe independent alert/log retrieval during R1/R3; not performed.</tspan></text>
</svg>
