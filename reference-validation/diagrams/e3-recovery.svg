<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="3741" viewBox="0 0 1880 3741" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">E3 recovery synthetic directed graph</title>
<desc id="diagram-description">Offline edge view. Repeated boxes refer to the same logical node IDs. Synthetic architecture only, not service or recovery validation. Red dashed edges are rejected designs.</desc>
<rect width="1880" height="3741" fill="#ffffff"/><defs><marker id="arrow-0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0078D4"/></marker><marker id="arrow-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C2D91"/></marker><marker id="arrow-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D13438"/></marker></defs>
<rect x="20" y="220" width="1840" height="3501" rx="6" fill="none" stroke="#495057" stroke-width="2"/>
<text id="e3-recovery-title" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="24"><tspan x="52" y="50">E3 recovery dependencies — synthetic edge view</tspan></text>
<text id="e3-recovery-insight" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="47" y="117.5">Arrow: recovering component depends on target. RED dashed edges are rejected alternatives, retained to expose bootstrap cycles; they are</tspan><tspan x="47" y="152.5">excluded from the selected dependency graph. Design mitigation is NOT tested recovery.</tspan></text>
<text id="e3-recovery-E3-RE01-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="280">E3-RE01</tspan></text>
<text id="e3-recovery-E3-RE01-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="330">Local identity/policy role and revocation state verified.</tspan></text>
<rect x="60" y="361" width="400" height="94" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e3-recovery-E3-RE01-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="390.5">E3-R-SITE</tspan><tspan x="79" y="425.5">Bounded safe local resumption</tspan></text>
<rect x="1420" y="361" width="400" height="94" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e3-recovery-E3-RE01-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="390.5">E3-R-SVC</tspan><tspan x="1439" y="425.5">Local identity/policy services</tspan></text>
<path d="M 470 408 L 1410 408" fill="none" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrow-1)"/>
<text id="e3-recovery-E3-RE01-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="490">Failure: No new privileged/state-changing operation.</tspan><tspan x="66" y="520">Alternative: Remain in approved safe-stop; do not accept corporate-only authority.</tspan></text>
<text id="e3-recovery-E3-RE02-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="619">E3-RE02</tspan></text>
<text id="e3-recovery-E3-RE02-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="669">Protected local console restores services without those same failed services.</tspan></text>
<rect x="60" y="700" width="400" height="94" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e3-recovery-E3-RE02-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="729.5">E3-R-SVC</tspan><tspan x="79" y="764.5">Local identity/policy services</tspan></text>
<rect x="1420" y="700" width="400" height="94" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e3-recovery-E3-RE02-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="729.5">E3-R-BOOT</tspan><tspan x="1439" y="764.5">Local protected recovery console</tspan></text>
<path d="M 470 747 L 1410 747" fill="none" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrow-1)"/>
<text id="e3-recovery-E3-RE02-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="829">Failure: If console login requires the failed local IdP, recovery cycles.</tspan><tspan x="66" y="859">Alternative: Independent recovery method/console demonstrated before reliance.</tspan></text>
<text id="e3-recovery-E3-RE03-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="958">E3-RE03</tspan></text>
<text id="e3-recovery-E3-RE03-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="1008">Trusted pre-change local baseline and tools.</tspan></text>
<rect x="60" y="1039" width="400" height="94" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e3-recovery-E3-RE03-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="1068.5">E3-R-BOOT</tspan><tspan x="79" y="1103.5">Local protected recovery console</tspan></text>
<rect x="1420" y="1039" width="400" height="94" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e3-recovery-E3-RE03-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="1068.5">E3-R-MEDIA</tspan><tspan x="1439" y="1103.5">Offline approved baseline/media</tspan></text>
<path d="M 470 1086 L 1410 1086" fill="none" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrow-1)"/>
<text id="e3-recovery-E3-RE03-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="1168">Failure: Unknown or compromised policy/identity state.</tspan><tspan x="66" y="1198">Alternative: Earlier independently approved offline copy; otherwise remain stopped.</tspan></text>
<text id="e3-recovery-E3-RE04-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="1297">E3-RE04</tspan></text>
<text id="e3-recovery-E3-RE04-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="1347">Local decrypt/sign/recovery custody independent of online vault.</tspan></text>
<rect x="60" y="1378" width="400" height="94" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e3-recovery-E3-RE04-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="1407.5">E3-R-BOOT</tspan><tspan x="79" y="1442.5">Local protected recovery console</tspan></text>
<rect x="1420" y="1378" width="400" height="94" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e3-recovery-E3-RE04-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="1407.5">E3-R-KEY</tspan><tspan x="1439" y="1442.5">Independent local recovery keys</tspan></text>
<path d="M 470 1425 L 1410 1425" fill="none" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrow-1)"/>
<text id="e3-recovery-E3-RE04-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="1507">Failure: Backups exist but cannot be used.</tspan><tspan x="66" y="1537">Alternative: Separate protected recovery key/custodian with tested offline retrieval.</tspan></text>
<text id="e3-recovery-E3-RE05-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="1636">E3-RE05</tspan></text>
<text id="e3-recovery-E3-RE05-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="1686">Bounded time, approved names, trust/revocation validity and power.</tspan></text>
<rect x="60" y="1717" width="400" height="94" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e3-recovery-E3-RE05-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="1746.5">E3-R-SVC</tspan><tspan x="79" y="1781.5">Local identity/policy services</tspan></text>
<rect x="1420" y="1717" width="400" height="94" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e3-recovery-E3-RE05-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="1746.5">E3-R-INFRA</tspan><tspan x="1439" y="1781.5">Local time/DNS/PKI/power</tspan></text>
<path d="M 470 1764 L 1410 1764" fill="none" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrow-1)"/>
<text id="e3-recovery-E3-RE05-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="1846">Failure: Authentication/trust cannot be safely evaluated.</tspan><tspan x="66" y="1876">Alternative: Local bootstrap configuration and holdover capacity; no fake clock bypass.</tspan></text>
<text id="e3-recovery-E3-RE06-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="1975">E3-RE06</tspan></text>
<text id="e3-recovery-E3-RE06-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="2025">Local logging capacity/integrity and required communications work.</tspan></text>
<rect x="60" y="2056" width="400" height="94" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e3-recovery-E3-RE06-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="2085.5">E3-R-SITE</tspan><tspan x="79" y="2120.5">Bounded safe local resumption</tspan></text>
<rect x="1420" y="2056" width="400" height="94" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e3-recovery-E3-RE06-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="2085.5">E3-R-EVID</tspan><tspan x="1439" y="2120.5">Local evidence/communications</tspan></text>
<path d="M 470 2103 L 1410 2103" fill="none" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrow-1)"/>
<text id="e3-recovery-E3-RE06-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="2185">Failure: No defensible monitored operation/coordination.</tspan><tspan x="66" y="2215">Alternative: Approved restricted/safe state; preserve evidence.</tspan></text>
<text id="e3-recovery-E3-RE07-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="2314">E3-RE07</tspan></text>
<text id="e3-recovery-E3-RE07-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="2364">Local safety veto released and separate recovery approval present.</tspan></text>
<rect x="60" y="2395" width="400" height="94" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e3-recovery-E3-RE07-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="2424.5">E3-R-SITE</tspan><tspan x="79" y="2459.5">Bounded safe local resumption</tspan></text>
<rect x="1420" y="2395" width="400" height="129" rx="6" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text id="e3-recovery-E3-RE07-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="2424.5">E3-R-SAFETY</tspan><tspan x="1439" y="2459.5">Local safety and recovery</tspan><tspan x="1439" y="2494.5">approval</tspan></text>
<path d="M 470 2459.5 L 1410 2459.5" fill="none" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrow-1)"/>
<text id="e3-recovery-E3-RE07-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="2559">Failure: No restart even if central cyber reports healthy.</tspan><tspan x="66" y="2589">Alternative: Remain stopped under local safety authority.</tspan></text>
<text id="e3-recovery-E3-RE08-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="2688">E3-RE08 — REJECTED DESIGN</tspan></text>
<text id="e3-recovery-E3-RE08-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="2738">Rejected design: console requires the failed local directory for all login.</tspan></text>
<rect x="60" y="2769" width="400" height="94" rx="6" fill="none" stroke="#D13438" stroke-width="2"/>
<text id="e3-recovery-E3-RE08-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="2798.5">E3-R-BOOT</tspan><tspan x="79" y="2833.5">Local protected recovery console</tspan></text>
<rect x="1420" y="2769" width="400" height="94" rx="6" fill="none" stroke="#D13438" stroke-width="2"/>
<text id="e3-recovery-E3-RE08-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="2798.5">E3-R-SVC</tspan><tspan x="1439" y="2833.5">Local identity/policy services</tspan></text>
<path d="M 470 2816 L 1410 2816" fill="none" stroke="#D13438" stroke-width="2" stroke-dasharray="10 8" marker-end="url(#arrow-2)"/>
<text id="e3-recovery-E3-RE08-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="2898">Failure: BOOT↔SVC cycle prevents recovery.</tspan><tspan x="66" y="2928">Alternative: Independent console method, not yet operationally proven.</tspan></text>
<text id="e3-recovery-E3-RE09-heading" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="16"><tspan x="68" y="3027">E3-RE09 — REJECTED DESIGN</tspan></text>
<text id="e3-recovery-E3-RE09-meaning" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="496" y="3077">Rejected design: only cloud vault supplies recovery key/online renewal.</tspan></text>
<rect x="60" y="3108" width="400" height="94" rx="6" fill="none" stroke="#D13438" stroke-width="2"/>
<text id="e3-recovery-E3-RE09-source-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="79" y="3137.5">E3-R-KEY</tspan><tspan x="79" y="3172.5">Independent local recovery keys</tspan></text>
<rect x="1420" y="3108" width="400" height="129" rx="6" fill="none" stroke="#D13438" stroke-width="2"/>
<text id="e3-recovery-E3-RE09-target-text" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="14"><tspan x="1439" y="3137.5">E3-R-CLOUD</tspan><tspan x="1439" y="3172.5">Rejected online vault/renewal</tspan><tspan x="1439" y="3207.5">path</tspan></text>
<path d="M 470 3172.5 L 1410 3172.5" fill="none" stroke="#D13438" stroke-width="2" stroke-dasharray="10 8" marker-end="url(#arrow-2)"/>
<text id="e3-recovery-E3-RE09-details" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="3272">Failure: Upstream loss blocks local recovery and invalidates S3 independence.</tspan><tspan x="66" y="3302">Alternative: Independently custodied local material with validated expiry/renewal.</tspan></text>
<text id="e3-recovery-limits" fill="#000000" font-family="Segoe UI, Arial, sans-serif" font-size="12"><tspan x="66" y="3396">Known cycles:</tspan><tspan x="66" y="3426">E3-RC01: E3-R-BOOT -&gt; E3-R-SVC; broken-by-design-not-tested. RE02/RE08 expose the rejected console/failed-IdP cycle. Require separately controlled local bootstrap</tspan><tspan x="66" y="3456">authority and test actual restoration.</tspan><tspan x="66" y="3486">Independent anchors:</tspan><tspan x="66" y="3516">E3-R-MEDIA: independent of Corporate/Entra sign-in, Live local IdP administration, Online repository/update service; still depends on Physical custodian, compatible</tspan><tspan x="66" y="3546">tools and approved version, Local power/hardware and integrity anchor. Proof: Recover selected real platform from offline media under safety approval; not executed.</tspan><tspan x="66" y="3576">E3-R-KEY: independent of Cloud vault, Corporate MFA/online certificate renewal, Failed local directory; still depends on Local protected custody/quorum,</tspan><tspan x="66" y="3606">Validity/revocation and usable hardware. Proof: Observe safe local key retrieval/recovery and expiry handling on actual implementation; fixture flags are insufficient.</tspan><tspan x="66" y="3636">E3-R-SAFETY: independent of Central cyber restart command, Central ITSM approval, Cloud telemetry health; still depends on Qualified available local safety and recovery</tspan><tspan x="66" y="3666">roles, Actual hazard-approved process state. Proof: Local safety authority signs and witnesses representative safe-state/restart exercise; not authorized.</tspan></text>
</svg>
